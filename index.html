<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction - Terminal</title>
    <!-- Liaison vers le fichier CSS -->
    <link rel="stylesheet" href="style-intro.css">
</head>
<body>

    <!-- Main terminal container -->
    <div class="terminal">

        <!-- Header: system identification -->
        <div class="header">
            <div class="title">FINANCIAL SYSTEM TERMINAL</div>
            <div>NETWORK ACCESS : ESTABLISHED</div>
            <div>SESSION : INTRODUCTION_001</div>
        </div>

        <!-- Welcome message with typing animation -->
        <div class="intro" id="intro-section">
            <div id="typing-text"></div>
            <span id="typing-cursor" class="cursor"></span>
        </div>

        <!-- Three available destinations -->
        <div class="choices" id="choices">
            <!-- OPTION 01 -->
            <a class="choice" href="#" onclick="startLoading('destination1'); return false;">
                [01] FINANCIAL ANALYSIS
            </a>

            <!-- OPTION 02 -->
            <a class="choice" href="#" onclick="startLoading('destination2'); return false;">
                [02] STOCK PORTFOLIO
            </a>

            <!-- OPTION 03 -->
            <a class="choice" href="#" onclick="startLoading('destination3'); return false;">
                [03] QUANTITATIVE ANALYSIS WITH PYTHON
            </a>
        </div>

        <!-- LOADING SCREEN -->
        <div class="loading-screen" id="loading-screen">
            <p>ESTABLISHING CONNECTION...</p>

            <div id="loading-message">
                INITIALIZING REQUEST...
            </div>

            <div class="loading-bar-container">
                <div class="loading-bar" id="loading-bar"></div>
            </div>

            <div class="loading-percent" id="loading-percent">
                0%
            </div>

            <span class="loading-cursor"></span>
        </div>

        <!-- Navigation status and blinking cursor -->
        <div class="footer">
            <span id="footer-status">SYSTEM READY // WAITING FOR USER INPUT</span>
            <span id="footer-cursor" class="cursor"></span>
        </div>

    </div>

    <!-- Liaison vers le fichier JavaScript -->
    <script src="script-intro.js"></script>
</body>
</html>
